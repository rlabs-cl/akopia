# adapter-s3 — polls an S3 / MinIO bucket and emits ChangeEvents.
#
# Deploys to the `akopia` namespace. Talks cross-namespace to the MinIO
# service in `atalaya-staging`. Credentials live in a dedicated Secret
# (`atalaya-minio-creds`) so they can be rotated without touching the
# generic `akopia-secrets`.
---
apiVersion: v1
kind: Secret
metadata:
  name: atalaya-minio-creds
  namespace: akopia
type: Opaque
stringData:
  # MinIO access key — atalaya issues one read-only key for akopia.
  S3_ACCESS_KEY: "atalaya"
  # Set via `kubectl -n akopia patch secret atalaya-minio-creds ...`
  # or copied from the source secret in atalaya-staging:
  #   kubectl -n atalaya-staging get secret atalaya-secrets \
  #     -o jsonpath='{.data.minio_secret_key}' | base64 -d
  S3_SECRET_KEY: "CHANGE_ME"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: adapter-s3-config
  namespace: akopia
data:
  S3_ENDPOINT_URL: "http://atalaya-minio.atalaya-staging.svc.cluster.local:9000"
  S3_BUCKET: "atalaya-closures"
  S3_PREFIX: "closures/"
  S3_REGION: "us-east-1"
  S3_USE_SSL: "false"
  S3_POLL_SECONDS: "60"
  S3_MAX_OBJECT_BYTES: "5242880"
  S3_INSTANCE_ID: "atalaya-closures"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adapter-s3
  namespace: akopia
  labels:
    app: adapter-s3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adapter-s3
  template:
    metadata:
      labels:
        app: adapter-s3
    spec:
      containers:
        - name: adapter-s3
          image: 192.168.2.142:30500/kb/adapter-s3:latest
          imagePullPolicy: Always
          envFrom:
            # Redis URL etc. comes from the shared akopia-config so
            # the adapter publishes to the same change-events stream.
            - configMapRef:
                name: akopia-config
            - configMapRef:
                name: adapter-s3-config
            - secretRef:
                name: atalaya-minio-creds
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
