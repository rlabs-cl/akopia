name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[all-text,mcp,s3]' pytest pytest-asyncio pytest-timeout httpx respx reportlab 'moto[s3,server]>=5.0' fakeredis

      - name: Run pytest
        run: pytest tests/ -x --tb=short

  compose-smoke:
    name: docker compose config validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config
